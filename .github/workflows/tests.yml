name: Angular Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add conf
        run: cp config.ts.dist config.ts

      - name: Install dependencies
        run: npm ci

      - name: Build (fail on warnings)
        run: |
          set -o pipefail
          NO_COLOR=1 npx ng build --configuration production 2>&1 | tee build.log
          if grep -nE '\[WARNING\]|Browserslist configuration' build.log; then exit 1; fi

      - name: Run unit tests
        run: npx ng test --watch=false
